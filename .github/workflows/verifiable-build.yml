name: verifiable-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install solana-verify
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.1/solana-verify-0.5.1-linux" -o "$HOME/.local/bin/solana-verify"
          chmod +x "$HOME/.local/bin/solana-verify"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/solana-verify" --version

      - name: Build
        run: solana-verify build --library-name ant_mine --base-image solanafoundation/solana-verifiable-build:4.0.3

      - name: Check size and security.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('target/deploy/ant_mine.so')
          b = p.read_bytes()
          n = len(b)
          print('size', n, 'osabi', b[7] if n > 7 else None)
          if n > 180000:
              raise SystemExit('TOO BIG %s > 180000' % n)
          if n > 7 and b[7] != 0:
              raise SystemExit('wrong ELF ABI osabi=%s (must be 0)' % b[7])
          if b'=======BEGIN SECURITY.TXT V1=======' not in b:
              raise SystemExit('missing security.txt magic')
          if b'zoeefm@proton.me' not in b:
              raise SystemExit('missing contact')
          print('security.txt OK, ABI OK')
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: ant_mine-so
          path: target/deploy/ant_mine.so
          if-no-files-found: error
